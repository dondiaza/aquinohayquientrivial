name: Deploy a Vercel (prebuilt)

# Por qué se construye aquí y no en Vercel ni en local:
#   · La cuenta del equipo NO tiene autorizados los builds en la nube de Vercel.
#   · `vercel build` en Windows genera una salida defectuosa (deduplica funciones y pierde
#     los manifiestos de cliente, así que toda página con componentes de cliente da 500).
# Solución: construir en Ubuntu con GitHub Actions y subir el resultado con `--prebuilt`.
#
# Ojo con la sintaxis: `secrets` NO está disponible en un `if:` de paso. Se expone como
# variable de entorno del job (`TIENE_VERCEL`) y los pasos consultan `env`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TIENE_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
      TIENE_BD: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cliente de Prisma
        run: npx prisma generate

      - name: Comprobaciones
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Migraciones en la base de datos de producción
        if: env.TIENE_BD == 'true'
        run: npx prisma migrate deploy
        env:
          # Las migraciones deben ir por la conexión DIRECTA, no por el pooler
          # (con el pooler dan P1002 por el advisory lock).
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      # El banco de preguntas es CONTENIDO, no datos de usuario: el seed es idempotente
      # (upsert por id) y archiva lo que ya no forma parte del pack en lugar de borrarlo,
      # así que no toca partidas ni perfiles. Sin este paso, un deploy con preguntas nuevas
      # dejaría la web con el banco viejo.
      - name: Sembrar el banco de preguntas
        if: env.TIENE_BD == 'true'
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Configuración del proyecto de Vercel
        if: env.TIENE_VERCEL == 'true'
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Build Output API)
        if: env.TIENE_VERCEL == 'true'
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy prebuilt a producción
        if: env.TIENE_VERCEL == 'true'
        id: deploy
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $URL"

      - name: Comprobación de humo
        if: env.TIENE_VERCEL == 'true'
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for ruta in "/" "/jugar/solo" "/como-jugar" "/portal" "/ranking" "/vecino" "/tarjetas"; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$URL$ruta")
            echo "$codigo  $ruta"
            test "$codigo" = "200"
          done

      # Los E2E van CONTRA LO DESPLEGADO, no contra un servidor local. Comprobar que el
      # juego funciona en la máquina de CI y no en producción es comprobar la mitad que no
      # importa: los fallos que costaron tiempo en este proyecto —imágenes que no aparecían,
      # cabecera que desbordaba— solo se ven en el artefacto real.
      - name: Navegador para E2E
        if: env.TIENE_VERCEL == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E contra producción
        if: env.TIENE_VERCEL == 'true'
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test

      - name: Guardar el rastro si algo falla
        if: failure() && env.TIENE_VERCEL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
